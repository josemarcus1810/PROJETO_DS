<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Almoxarifado</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="pagina-login">

    <main class="login-container">

        <section class="login-card">
            <h1>Almoxarifado</h1>
            <p class="login-descricao">
                Entre com seus dados para acessar o sistema.
            </p>

            {% for categoria, mensagem in get_flashed_messages(with_categories=true) %}
            <div class="mensagem mensagem-{{ categoria }}" role="alert">{{ mensagem }}</div>
            {% endfor %}

            <form action="{{ url_for('login') }}" method="post">

                <label for="usuario">Usuário:</label>
                <input
                    type="text"
                    id="usuario"
                    name="usuario"
                    value="{{ usuario }}"
                    placeholder="Digite seu usuário"
                    autocomplete="username"
                    maxlength="50"
                    required
                    autofocus
                >

                <label for="senha">Senha:</label>
                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Digite sua senha"
                    autocomplete="current-password"
                    required
                >

                <button type="submit">Entrar</button>

            </form>

            <p class="login-link">
                <a href="{{ url_for('esqueci_senha') }}">Esqueci minha senha</a>
            </p>
        </section>

        <footer class="login-footer">
            <p>Sistema de Almoxarifado</p>
        </footer>

    </main>

</body>
</html>
