
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Produto - Almoxarifado</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="layout">

        <aside class="sidebar">
            <h1>Almoxarifado</h1>

            <nav>
                <ul>
                    <li><a href="{{ url_for('inicio') }}">Início</a></li>
                    <li><a href="{{ url_for('produtos') }}">Produtos</a></li>
                    <li><a href="{{ url_for('lotes') }}">Lotes</a></li>
                    <li><a href="{{ url_for('pedidos') }}">Pedidos de compra</a></li>
                    <li><a href="{{ url_for('movimentacoes') }}">Movimentações</a></li>
                    <li><a href="{{ url_for('usuario') }}">Usuário</a></li>
                    <li><a href="{{ url_for('login') }}">Sair</a></li>
                </ul>
            </nav>
        </aside>

        <div class="conteudo">

            <header class="topo">
                <div>
                    <h2>Editar produto</h2>
                    <p>Atualize as informações do produto cadastrado.</p>
                </div>
            </header>

            <main>
                <section>
                    <h3>Dados do produto</h3>

                    <form action="{{ url_for('editar_produto', id=produto.id) }}" method="POST">

                        <label for="codigo">Código do produto:</label>
                        <input
                            type="text"
                            id="codigo"
                            value="{{ produto.codigo }}"
                            readonly
                        >

                        <label for="nome">Nome do produto:</label>
                        <input
                            type="text"
                            id="nome"
                            name="nome"
                            value="{{ produto.nome }}"
                            required
                        >

                        <label for="tipo">Tipo do produto:</label>
                        <select name="tipo" id="tipo" required>
                            <option value="papelaria" {% if produto.tipo == 'papelaria' %}selected{% endif %}>Papelaria</option>
                            <option value="limpeza" {% if produto.tipo == 'limpeza' %}selected{% endif %}>Limpeza</option>
                            <option value="informatica" {% if produto.tipo == 'informatica' %}selected{% endif %}>Informática</option>
                            <option value="outros" {% if produto.tipo == 'outros' %}selected{% endif %}>Outros</option>
                        </select>

                        <label for="validade">Data de validade:</label>
                        <input
                            type="date"
                            name="validade"
                            id="validade"
                            value="{{ produto.data_validade.strftime('%Y-%m-%d') if produto.data_validade else '' }}"
                        >

                        <label for="quantidade">Quantidade:</label>
                        <input
                            type="number"
                            id="quantidade"
                            name="quantidade"
                            value="{{ produto.quantidade }}"
                            min="0"
                            required
                        >

                        <label for="situacao">Situação:</label>
                        <select id="situacao" name="situacao" required>
                            <option value="disponível" {% if produto.situacao == 'disponível' %}selected{% endif %}>Disponível</option>
                            <option value="indisponível" {% if produto.situacao == 'indisponível' %}selected{% endif %}>Indisponível</option>
                        </select>

                        <button type="submit">Salvar alterações</button>

                        <a href="{{ url_for('produtos') }}">Cancelar</a>
                    </form>
                </section>
            </main>

            <footer>
                <p>Sistema de Almoxarifado</p>
            </footer>

        </div>
    </div>

</body>
</html>
