<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Lote - Almoxarifado</title>
    <link rel="stylesheet" href="../CSS/style.css">
</head>
<body>

    <div class="layout">

        <aside class="sidebar">
            <h1>Almoxarifado</h1>

            <nav>
                <ul>
                    <li><a href="index.html">Início</a></li>
                    <li><a href="produtos.html">Produtos</a></li>
                    <li><a href="lotes.html" class="ativo">Lotes</a></li>
                    <li><a href="pedidos.html">Pedidos de compra</a></li>
                    <li><a href="movimentacoes.html">Movimentações</a></li>
                    <li><a href="usuario.html">Usuário</a></li>
                </ul>
            </nav>

            <a href="login.html" class="sair">Sair</a>
        </aside>

        <div class="conteudo">

            <header class="topo">
                <div>
                    <h2>Editar lote</h2>
                    <p>Consulte e atualize as informações do lote.</p>
                </div>
            </header>

            <main>
                <section>
                    <h3>Dados do lote</h3>

                    <form>
                        <label for="numero">Número do lote:</label>
                        <input
                            type="text"
                            id="numero"
                            name="numero"
                            value="LOTE_01"
                            readonly
                        >

                        <label for="produto">Produto:</label>
                        <input
                            type="text"
                            id="produto"
                            name="produto"
                            value="Papel A4"
                            readonly
                        >

                        <label for="quantidade">Quantidade:</label>
                        <input
                            type="number"
                            id="quantidade"
                            name="quantidade"
                            value="100"
                            min="1"
                            required
                        >

                        <label for="validade">Data de validade:</label>
                        <input
                            type="date"
                            id="validade"
                            name="validade"
                            value="2027-12-15"
                        >

                        <label for="situacao">Situação:</label>
                        <select id="situacao" name="situacao" required>
                            <option value="ativo" selected>Ativo</option>
                            <option value="inativo">Inativo</option>
                        </select>

                        <button type="submit">Salvar alterações</button>

                        <a href="lotes.html">Cancelar</a>
                    </form>
                </section>
            </main>

            <footer>
                <p>Sistema de Almoxarifado</p>
            </footer>

        </div>
    </div>

</body>
</html>
