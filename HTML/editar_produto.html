<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Produto</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <h1>Sistema de Almoxarifado</h1>
        
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="produtos.html">Produtos</a></li>
                <li><a href="lotes.html">Lotes</a></li>
                <li><a href="pedidos.html">Pedidos de compra</a></li>
                <li><a href="movimentacoes.html">Movimentações</a></li>
                <li><a href="usuario.html">Usuário</a></li>
                <li><a href="login.html">Sair</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h2>Editar produto</h2>
        
        <form>
            <label for="id">ID do produto:</label>
            <input type="text" name="id" id="id" value="PAP_01" readonly>

            <label for="nome">Nome do produto:</label>
            <input type="text" id="nome" name="nome" value="Papel A4" required>

            <label for="tipo">Tipo do produto:</label>
           <select name="tipo" id="tipo" required>
                    <option value="">Selecione um tipo:</option>
                    <option value="papelaria" selected>Papelaria</option>
                    <option value="limpeza">Limpeza</option>
                    <option value="informatica">Informática</option>
                    <option value="outros">Outros</option>
            </select>

            <label for="validade">Data de validade:</label>
            <input type="date" name="validade" id="validade" value="2027-12-15">
            
            <label for="quantidade">Quantidade</label>
            <input type="number" id="quantidade" name="quantidade" value="100" min="1" required>

            <label for="situacao">Situação:</label>
            <select id="situacao" name="situacao" required>
                <option value="ativo" selected>Ativo</option>
                <option value="inativo">Inativo</option>
            </select>
            
            <button type="submit">Salvar alterações</button>

            <a href="produtos.html">Cancelar</a>

        </form>
    
        </main>
            <footer>
                <p>Sistema de Almoxarifado</p>
            </footer>
    </body>
</html>
