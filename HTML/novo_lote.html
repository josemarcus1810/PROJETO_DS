<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Lote - Almoxarifado</title>
    <link rel="stylesheet" href="../CSS/style.css">
</head>
<body>

    <div class="layout">

        <aside class="sidebar">
            <h1>Almoxarifado</h1>

            <nav>
                <ul>
                    <li><a href="index.html">Início</a></li>
                    <li><a href="produtos.html">Produtos</a></li>
                    <li><a href="lotes.html" class="ativo">Lotes</a></li>
                    <li><a href="pedidos.html">Pedidos de compra</a></li>
                    <li><a href="movimentacoes.html">Movimentações</a></li>
                    <li><a href="usuario.html">Usuário</a></li>
                </ul>
            </nav>

            <a href="login.html" class="sair">Sair</a>
        </aside>

        <div class="conteudo">

            <header class="topo">
                <div>
                    <h2>Cadastrar novo lote</h2>
                    <p>Adicione um novo lote a um produto já cadastrado.</p>
                </div>
            </header>

            <main>
                <section>
                    <h3>Dados do lote</h3>

                    <form>
                        <label for="produto">Produto:</label>
                        <select name="produto" id="produto" required>
                            <option value="">Selecione um produto</option>
                            <option value="PAP_01">Papel A4</option>
                            <option value="LIM_01">Detergente</option>
                            <option value="INF_01">Teclado</option>
                        </select>

                        <label for="quantidade">Quantidade:</label>
                        <input
                            type="number"
                            name="quantidade"
                            id="quantidade"
                            min="1"
                            required
                        >

                        <label for="validade">Data de validade:</label>
                        <input
                            type="date"
                            name="validade"
                            id="validade"
                        >

                        <button type="submit">Cadastrar lote</button>

                        <a href="lotes.html">Cancelar</a>
                    </form>
                </section>
            </main>

            <footer>
                <p>Sistema de Almoxarifado</p>
            </footer>

        </div>
    </div>

</body>
</html>
